name: Generate Terraria JP Fake APK

on:
  workflow_dispatch: # 手动触发
    inputs:
      tag_name:
        description: '版本标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Minimal Terraria JP Project
        run: |
          # 1. 创建目录结构
          mkdir -p app/src/main/res/values
          
          # 2. 写入特定的 AndroidManifest.xml
          # 这里使用了 Spike Chunsoft 的包名
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" 
              package="jp.co.spike_chunsoft.android.terrariajp">
              <application 
                  android:label="Terraria JP (Empty)"
                  android:icon="@android:mipmap/sym_def_app_icon">
              </application>
          </manifest>
          EOF

          # 3. 基础 build.gradle 配置
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:9.0.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 4. 设置关键的 ApplicationId
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'jp.co.spike_chunsoft.android.terrariajp'
              compileSdk 36
              defaultConfig {
                  applicationId "jp.co.spike_chunsoft.android.terrariajp"
                  minSdk 21
                  targetSdk 36
                  versionCode 1
                  versionName "1.0.0"
              }
          }
          EOF

          # 5. 项目结构声明
          echo "include ':app'" > settings.gradle

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          # 首次运行 Gradle 会自动下载环境
          gradle assembleDebug --no-daemon
      - name: Find and Rename APK
        # 使用 find 命令确保一定能找到生成的 APK，并移动到当前根目录
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "错误：未找到生成的 APK 文件"
            exit 1
          fi
          cp "$APK_PATH" ./Terraria_JP_Empty.apk
          echo "APK 已准备就绪: ./Terraria_JP_Empty.apk"

  #    - name: Upload APK
 #       uses: actions/upload-artifact@v4
#        with:
#          name: terraria-jp-empty-apk
#          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          body: |
            泰拉瑞亚日本地区 (Spike Chunsoft) 空包生成成功。
            包名: `jp.co.spike_chunsoft.android.terrariajp`
            口号：忠诚。
          draft: false
          prerelease: false
          files: Terraria_JP_Empty.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}